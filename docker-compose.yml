services:

  # ── Nginx web server ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: webte2-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webte2

  # ── PHP-FPM + Octave ─────────────────────
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: webte2-app
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-webte2}
      - DB_USERNAME=${DB_USERNAME:-webte2user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webte2

  # ── MariaDB ──────────────────────────────
  db:
    image: mariadb:11
    container_name: webte2-db
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_DATABASE:-webte2}
      MARIADB_USER: ${DB_USERNAME:-webte2user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webte2

networks:
  webte2:
    driver: bridge

volumes:
  dbdata:
    driver: local